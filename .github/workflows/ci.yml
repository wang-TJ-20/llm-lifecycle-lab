name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-pretrain:
    name: Native pretrain CPU (${{ matrix.install }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        install: [locked, requirements]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        if: matrix.install == 'locked'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync locked dependencies
        if: matrix.install == 'locked'
        run: uv sync --extra training --extra public-data --extra dev --locked --no-install-project --python 3.11

      - name: Use locked environment for Python scripts
        if: matrix.install == 'locked'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install through requirements
        if: matrix.install == 'requirements'
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Lint
        run: python -m ruff check src scripts tests pyproject.toml

      - name: Check formatting
        run: python -m ruff format --check src scripts tests

      - name: Run tests
        run: python -m pytest -q

      - name: Compile package
        run: python -m compileall -q src scripts tests

      - name: Validate reference configurations
        run: |
          for config in configs/pipelines/*.yaml; do
            python scripts/validate_config.py "$config"
          done

      - name: Run base preflight
        run: python scripts/doctor.py

      - name: Inspect native smoke model
        run: python scripts/inspect_model.py --config configs/models/smoke-10m.yaml
