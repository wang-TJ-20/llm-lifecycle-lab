schema_version: '1.0'
suite_id: lifecycle-v4
license: Apache-2.0
description: Project-authored bilingual probes, lifecycle-v4. v1/v2 score instruction
  and qa over 4 cases each, so one flipped case moves the metric by 0.25 -- the size
  of every measured post-SFT difference. This suite scales each scored category to
  30+ cases. Built by scripts/build_evaluation_suite.py (seed 31337, offset 1000)
  and leakage-checked against the training sources. Not a general benchmark; do not
  train on these.
