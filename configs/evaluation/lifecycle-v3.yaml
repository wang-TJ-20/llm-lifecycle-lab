schema_version: '1.0'
suite_id: lifecycle-v3
license: Apache-2.0
description: Project-authored bilingual probes, version 3. v1/v2 score instruction
  and qa over 4 cases each, so one flipped case moves the metric by 0.25 -- the size
  of every measured post-SFT difference. v3 scales each scored category to 30+ cases.
  Built by scripts/build_evaluation_suite.py (seed 31337) and leakage-checked against
  the training sources. Not a general benchmark; do not train on these.
