schema_version: "1.0"
model_route: native
run_profile: smoke
stage: grpo
seed: 42
output_dir: runs
model:
  provider: native
  model_id: tiny-60m
  init_checkpoint: runs/native-sft/checkpoints/step-00000002
  tokenizer: data/tokenizers/bilingual-60m-v1
data:
  manifest: data/prepared/grpo-bilingual-v1/data_manifest.json
  evaluation_suite: configs/evaluation/lifecycle-v1.yaml
training:
  device: cpu
  dtype: float32
  sequence_length: 512
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 2
  learning_rate: 0.000002
  group_size: 4
  max_new_tokens: 16
  temperature: 1.0
  top_p: 1.0
  kl_beta: 0.04
  advantage_epsilon: 0.0001
  warmup_steps: 0
  checkpoint_interval: 1
  eval_interval: 1
  eval_batches: 2
  log_interval: 1
