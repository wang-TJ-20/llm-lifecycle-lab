schema_version: "1.0"
model_route: native
run_profile: learn
stage: dpo
seed: 42
output_dir: runs
model:
  provider: native
  model_id: tiny-60m
  init_checkpoint: runs/native-sft-60m-001/checkpoints/step-00000626
  tokenizer: data/tokenizers/bilingual-60m-v1
data:
  manifest: data/prepared/dpo-bilingual-v1/data_manifest.json
  evaluation_suite: configs/evaluation/lifecycle-v1.yaml
training:
  device: cuda
  dtype: bfloat16
  sequence_length: 512
  micro_batch_size: 16
  gradient_accumulation_steps: 4
  num_epochs: 1.0
  learning_rate: 0.000002
  beta: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 10
  min_lr_ratio: 0.1
  gradient_clipping: 1.0
  checkpoint_interval: 25
  eval_interval: 25
  eval_batches: 64
  log_interval: 10
