schema_version: "1.0"
model_route: native
run_profile: learn
stage: dpo
seed: 42
output_dir: runs
model:
  provider: native
  model_id: tiny-60m
  init_checkpoint: runs/selected-sft/checkpoints/from-training-result
  tokenizer: data/tokenizers/bilingual-60m-v1
data:
  manifest: data/prepared/dpo-public-60m-v3/data_manifest.json
  evaluation_suite: configs/evaluation/lifecycle-v3.yaml
training:
  device: cuda
  dtype: bfloat16
  sequence_length: 512
  micro_batch_size: 16
  gradient_accumulation_steps: 4
  max_train_tokens: 3000000
  learning_rate: 0.000002
  beta: 0.1
  nll_coefficient: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 5
  min_lr_ratio: 0.1
  gradient_clipping: 1.0
  checkpoint_interval: 100
  eval_interval: 50
  eval_batches: 32
  log_interval: 5
