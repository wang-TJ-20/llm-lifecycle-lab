schema_version: "1.0"
model_route: qwen3-transfer
run_profile: learn
stage: sft
seed: 42
output_dir: runs
model:
  provider: huggingface
  model_id: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  tokenizer_revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  transformers_version: 4.53.3
  snapshot: artifacts/qwen3-0.6b-base
  training_method: qlora
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: bfloat16
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules:
      - q_proj
      - v_proj
data:
  manifest: data/prepared/sft-bilingual-v1/data_manifest.json
  evaluation_suite: configs/evaluation/lifecycle-v1.yaml
training:
  device: cuda
  dtype: bfloat16
  sequence_length: 512
  micro_batch_size: 16
  gradient_accumulation_steps: 4
  num_epochs: 3.0
  learning_rate: 0.0002
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 20
  min_lr_ratio: 0.1
  gradient_clipping: 1.0
  checkpoint_interval: 100
  eval_interval: 100
  eval_batches: 64
  log_interval: 10
