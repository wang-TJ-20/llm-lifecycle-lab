data:
  manifest: data/prepared/bilingual-60m-v1/data_manifest.json
  packed_manifest: data/packed/bilingual-60m-v1-seq512/packed_manifest.json
model:
  architecture: dense-decoder
  config: configs/models/tiny-60m.yaml
  model_id: tiny-60m
  provider: native
  tokenizer: data/tokenizers/bilingual-60m-v1
model_route: native
output_dir: runs
run_profile: reproduce
schema_version: '1.0'
seed: 42
stage: pretrain
training:
  beta1: 0.9
  beta2: 0.95
  checkpoint_interval: 500
  device: cuda
  dtype: bfloat16
  eval_batches: 64
  eval_interval: 500
  gradient_accumulation_steps: 16
  gradient_clipping: 1.0
  learning_rate: 0.0003
  log_interval: 10
  micro_batch_size: 1
  min_lr_ratio: 0.1
  num_epochs: 1.0
  sequence_length: 512
  warmup_steps: 50
  weight_decay: 0.1
