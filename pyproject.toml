[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-lifecycle-lab"
version = "0.1.0.dev0"
description = "Learn the LLM lifecycle from pretraining to post-training through reproducible experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
  "llm",
  "pretraining",
  "post-training",
  "dpo",
  "grpo",
  "education",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
training = [
  "numpy>=1.26,<3",
  "tokenizers>=0.21,<0.22",
  "torch>=2.4,<3",
]
public-data = [
  "huggingface-hub==0.36.2",
  "pyarrow==25.0.1",
]
interop = [
  "transformers==4.53.3",
  "peft==0.17.1",
  "accelerate==1.10.1",
  "safetensors==0.6.2",
  "psutil==7.2.2",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lifecycle_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
